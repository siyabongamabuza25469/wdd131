<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Submission Form</title>
    <meta name="description" content="Explore our amazing range of products through our user-friendly review form. Share your experiences and insights with others!">
    <meta name="author" content="Siyabonga Bafanabakhe Mabuza">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-media.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name:</label>
            <select id="product" name="product" required>
    <option value="" disabled selected>Select a Product ...</option>
</select>
            <fieldset>
            <legend>Overall Rating:</legend>
            <input type="radio" id="rating1" name="rating" value="1" required>
            <label for="rating1" title="1 star">1 Star</label>
            <input type="radio" id="rating2" name="rating" value="2">
            <label for="rating2" title="2 stars">2 Stars</label>
            <input type="radio" id="rating3" name="rating" value="3">
            <label for="rating3" title="3 stars">3 Stars</label>
            <input type="radio" id="rating4" name="rating" value="4">
            <label for="rating4" title="4 stars">4 Stars</label>
            <input type="radio" id="rating5" name="rating" value="5">
            <label for="rating5" title="5 stars">5 Stars</label>
            </fieldset>
            <label for="installationDate">Date of Installation:</label>
            <input type="date" id="installationDate" name="installationDate" required>
            <label>Features:</label><br/> 
            <input type="checkbox" id="feature1" name="features" value="Feature 1">
            <label for="feature1">Feature 1</label><br/>
            <input type="checkbox" id="feature2" name="features" value="Feature 2">
            <label for="feature2">Feature 2</label>
            <input type="checkbox" id="feature3" name="features" value="Feature 3">
            <label for="feature3">Feature 3</label>
            <input type="checkbox" id="feature4" name="features" value="Feature 4">
            <label for="feature4">Feature 4</label>
            <input type="checkbox" id="feature5" name="features" value="Feature 5">
            <label for="feature5">Feature 5</label>
            <label for="review">Written Review:</label>
            <textarea id="review" name="review" required></textarea>
            <input type="submit" value="Submit Review">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentYear">2025</span> Siyabonga Bafanabakhe Mabuza. Gauteng, South Africa <span id="lastModified"></span></p>
    </footer>
</body>
</html>
