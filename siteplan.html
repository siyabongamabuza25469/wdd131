    <title>Freelance Web Developer Portfolio</title>
    <link rel="stylesheet" href="styles/siteplan.css">
    <script src="scripts/siteplan.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="logo">
                <img src="images/devportfolio-logo.jpg" alt="DevPortfolio Logo">
                <a href="index.html">DevPortfolio</a>

                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </nav>
    </header>
    <main>
        <h1>Portfolio site for a freelance web developer</h1>
        <section id="contact-form-section">
    <h2>Get in Touch</h2>
    <p>Have a project in mind? Let's connect!</p>
    <form id="contactForm" action="#" method="POST">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required aria-required="true" placeholder="Your Name">
            <span class="error-message" id="nameError"></span>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required aria-required="true" placeholder="your.email@example.com">
            <span class="error-message" id="emailError"></span>
        </div>
        <div class="form-group">
            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" required aria-required="true" placeholder="Project Inquiry">
            <span class="error-message" id="subjectError"></span>
        </div>
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="6" required aria-required="true" placeholder="Tell me about your project..."></textarea>
            <span class="error-message" id="messageError"></span>
        </div>
        <button type="submit" class="btn">Send Message</button>
        <p id="formStatus" aria-live="polite"></p>
    </form>
</section>
    </main>
    <footer>
       <p>&copy; <span id="currentYear">2025</span> Siyabonga Bafanabakhe Mabuza. Gauteng, South Africa <span id="lastModified"></span></p>
